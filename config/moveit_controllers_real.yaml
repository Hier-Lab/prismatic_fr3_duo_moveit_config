moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_start_tolerance: 0.02
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - dual_arm_controller
    - left_franka_gripper
    - right_franka_gripper

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - right_fr3_joint1
      - right_fr3_joint2
      - right_fr3_joint3
      - right_fr3_joint4
      - right_fr3_joint5
      - right_fr3_joint6
      - right_fr3_joint7

  dual_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7
      - right_fr3_joint1
      - right_fr3_joint2
      - right_fr3_joint3
      - right_fr3_joint4
      - right_fr3_joint5
      - right_fr3_joint6
      - right_fr3_joint7

  left_franka_gripper:
    type: GripperCommand
    action_ns: gripper_action
    default: true
    joints:
      - left_fr3_finger_joint1
      - left_fr3_finger_joint2

  right_franka_gripper:
    type: GripperCommand
    action_ns: gripper_action
    default: true
    joints:
      - right_fr3_finger_joint1
      - right_fr3_finger_joint2
