# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.05
default_acceleration_scaling_factor: 0.05

# Arm velocity limits come from franka_description/robots/fr3/joint_limits.yaml.
# MoveIt uses the FR3 deceleration limits as symmetric acceleration limits.
# Rail and gripper acceleration limits stay disabled because the FR3 file does not define them.
joint_limits:
  base_slider_joint:
    has_velocity_limits: true
    max_velocity: 0.20000000000000001
    has_acceleration_limits: false
    max_acceleration: 0
