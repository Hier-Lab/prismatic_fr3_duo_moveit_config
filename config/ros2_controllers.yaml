# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    # left_arm_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    # right_arm_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_controller_wbc:
      type: crisp_controllers/WholeBodyController

    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_controller:
    #   type: position_controllers/GripperActionController
      type: joint_trajectory_controller/JointTrajectoryController

    # whole_body_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    whole_body_controller:
      type: crisp_controllers/WholeBodyController


    # base_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7
    command_interfaces:
      - position
      # - velocity
      # - effort
    state_interfaces:
      - position
      - velocity
      # - effort

##### PID Control with effort commands #####
dual_arm_controller:
  ros__parameters:
    joints:
      - left_fr3_joint1
      - left_fr3_joint2
      - left_fr3_joint3
      - left_fr3_joint4
      - left_fr3_joint5
      - left_fr3_joint6
      - left_fr3_joint7
      - right_fr3_joint1
      - right_fr3_joint2
      - right_fr3_joint3
      - right_fr3_joint4
      - right_fr3_joint5
      - right_fr3_joint6
      - right_fr3_joint7
    command_interfaces:
      # - position
      # - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      # - effort
    gains:
      left_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      left_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      left_fr3_joint6: { p: 250., d: 10., i: 0., i_clamp: 1. }
      left_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }
      right_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      right_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      right_fr3_joint6: { p: 250., d: 10., i: 0., i_clamp: 1. }
      right_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

