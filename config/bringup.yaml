# Edit this file instead of passing robot-specific values on the command line.
robots:
  left:
    ip: "192.168.1.11"
    prefix: "left_"
  right:
    ip: "192.168.1.15"
    prefix: "right_"

simulation:
  # Supported values: fake, isaac
  hardware_mode: "isaac"
  use_sim_time: true
  controller_manager_update_rate: 500
  use_rviz: true
  debug: false
  active_controllers:
    - joint_state_broadcaster
    - dual_arm_controller_wbc
    - left_hand_controller
    - right_hand_controller
  inactive_controllers:
    - dual_arm_controller
    - base_controller
    - left_arm_controller
    - right_arm_controller
    - left_cartesian_controller
    - right_cartesian_controller
    - whole_body_controller

real_hardware:
  hardware_mode: "real"
  use_sim_time: false
  controller_manager_update_rate: 500
  controller_manager_thread_priority: 90
  # Run each arm's readOnce/writeOnce in its own driver thread (franka_ros2 branch
  # feat/async-franka-hardware). Humble's ros2_control has no async components, and without
  # this the update thread reads both arms serially and trips communication_constraints_violation.
  hardware_is_async: true
  # FIFO priority of the per-arm I/O threads; must be above controller_manager_thread_priority.
  hardware_thread_priority: 95
  # Add isolated CPU IDs here (for example, [2, 3]) after configuring the RT host.
  controller_manager_cpu_affinity: []
  joint_state_publish_rate: 200
  start_grippers: true
  active_controllers:
    - joint_state_broadcaster
    - left_franka_robot_state_broadcaster
    - right_franka_robot_state_broadcaster
    - dual_arm_controller_wbc
  inactive_controllers:
    - base_controller
    - left_arm_controller
    - right_arm_controller
    - dual_arm_controller
    - left_cartesian_controller
    - right_cartesian_controller
    # - whole_body_controller

moveit:
  use_sim_time: false
  use_rviz: true
  debug: false
  allow_trajectory_execution: true
  publish_frequency: 60.0
  publish_monitored_planning_scene: true
