# base:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
#   kinematics_solver_search_resolution: 0.0050000000000000001
#   kinematics_solver_timeout: 0.0050000000000000001
left_arm:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

right_arm:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

left_hand:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

right_hand:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

whole_body:
  kinematics_solver: wbdopt_ik_kinematics_plugin/WbdoptIkKinematicsPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_search_resolution: 0.05
  tip_frames: [left_fr3_hand_tcp, right_fr3_hand_tcp]
  solver_type: qp
  epsilon: 0.001
  regularization: 0.01
  position_weight: 1.0
  orientation_weight: 1.0
  joint_centering_name: base_slider_joint
  joint_centering_weight: 0.001
  safety_distance: 0.005
  collision_activation_distance: 0.05
  max_joint_step: 0.50
  max_iterations: 100
  nominal_joint_names: [base_slider_joint,
    left_fr3_joint1, left_fr3_joint2, left_fr3_joint3, left_fr3_joint4,
    left_fr3_joint5, left_fr3_joint6, left_fr3_joint7,
    right_fr3_joint1, right_fr3_joint2, right_fr3_joint3, right_fr3_joint4,
    right_fr3_joint5, right_fr3_joint6, right_fr3_joint7]
  nominal_joint_positions: [0.0,
    0.0, -0.7853981633974483, 0.0, -2.356194490192345,
    0.0, 1.5707963267948966, 0.7853981633974483,
    0.0, -0.7853981633974483, 0.0, -2.356194490192345,
    0.0, 1.5707963267948966, 0.7853981633974483]

dual_arm:
  kinematics_solver: wbdopt_ik_kinematics_plugin/WbdoptIkKinematicsPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_search_resolution: 0.05
  solver_type: qp  # Use nlopt for direct nonlinear SLSQP, qp for QP solver
  tip_frames: [left_fr3_hand_tcp, right_fr3_hand_tcp]
  epsilon: 0.001
  regularization: 0.001
  position_weight: 1.0
  orientation_weight: 1.0
  joint_centering_name: ""
  joint_centering_weight: 0.0
  safety_distance: 0.03
  collision_activation_distance: 0.2
  max_joint_step: 0.1
  max_iterations: 100
  nominal_joint_names: [
    left_fr3_joint1, left_fr3_joint2, left_fr3_joint3, left_fr3_joint4,
    left_fr3_joint5, left_fr3_joint6, left_fr3_joint7,
    right_fr3_joint1, right_fr3_joint2, right_fr3_joint3, right_fr3_joint4,
    right_fr3_joint5, right_fr3_joint6, right_fr3_joint7]
  nominal_joint_positions: [
    0.0, -0.7853981633974483, 0.0, -2.356194490192345,
    0.0, 1.5707963267948966, 0.7853981633974483,
    0.0, -0.7853981633974483, 0.0, -2.356194490192345,
    0.0, 1.5707963267948966, 0.7853981633974483]
